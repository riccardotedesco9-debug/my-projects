<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1F3864; --teal: #0F766E; --teal-soft: #B2DFDB;
    --green: #2E7D32; --red: #B91C1C; --gray: #6B7280; --gold: #B45309;
    --line: #E4E4DE; --paper: #FBFBF8; --card: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: 'Outfit', sans-serif; background: var(--paper); color: var(--navy);
    padding: 14px 14px 18px; font-size: 14px;
  }
  .wordmark {
    font-size: 11px; letter-spacing: .22em; font-weight: 700; color: var(--gray);
    text-transform: uppercase; margin-bottom: 12px;
  }
  .wordmark b { color: var(--teal); }

  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
    color: var(--gray); margin: 6px 0 8px;
  }

  /* Running-session cards, each with its own live clock. */
  .card {
    border-left: 3px solid var(--green); background: var(--card);
    border-radius: 0 8px 8px 0; padding: 9px 11px; margin-bottom: 8px;
    box-shadow: 0 1px 2px rgba(31,56,100,.06);
  }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .who { min-width: 0; }
  .who b { display: flex; align-items: center; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who b::before {
    content: ''; flex: none; width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); margin-right: 7px; animation: breathe 2s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: .28; } }
  .who .task { color: var(--gray); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; padding-left: 14px; }
  .card .clock {
    font-family: 'Spline Sans Mono', monospace; font-variant-numeric: tabular-nums;
    font-size: 26px; font-weight: 600; color: var(--navy); flex: none; line-height: 1;
  }
  .card-bot { display: flex; align-items: center; justify-content: space-between; margin-top: 7px; min-height: 22px; }
  .free-tag {
    font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--green);
    background: #E8F5E9; border-radius: 4px; padding: 2px 6px;
  }
  .tbd-tag {
    font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--gold);
    background: #FEF3C7; border-radius: 4px; padding: 2px 6px;
  }
  .stopbtn {
    border: 1px solid var(--red); background: #fff; color: var(--red);
    font: 600 12px 'Outfit', sans-serif; border-radius: 7px; padding: 5px 12px; cursor: pointer;
  }
  .stopbtn:active { transform: scale(.98); }
  .stopbtn:disabled { opacity: .5; cursor: default; }
  .empty { color: var(--gray); font-size: 12.5px; padding: 6px 2px 10px; line-height: 1.4; }

  hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0 12px; }

  label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .08em;
          text-transform: uppercase; color: var(--gray); margin: 10px 0 4px; }
  select, input[type=text] {
    width: 100%; font: 16px 'Outfit', sans-serif; color: var(--navy);
    padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
  }
  select:focus, input:focus { outline: none; border-color: var(--teal); }
  /* Recent-task quick-pick chips under the Task field. */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
  .chip {
    font-size: 12px; color: var(--teal); background: #F0FAF8; border: 1px solid var(--teal-soft);
    border-radius: 12px; padding: 3px 10px; cursor: pointer; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chip:hover { background: #E3F4F1; }

  .btn {
    width: 100%; border: 0; border-radius: 10px; padding: 12px 0; margin-top: 12px;
    font: 600 15px 'Outfit', sans-serif; color: #fff; cursor: pointer;
    transition: transform .05s ease, filter .15s ease;
  }
  .btn:active { transform: scale(.985); }
  .btn:disabled { filter: grayscale(.6) opacity(.45); cursor: default; }
  .btn.start { background: var(--green); box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }
  .btn.stopall { background: var(--red); box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); margin-top: 4px; }

  .confirm {
    display: none; margin-top: 12px; padding: 11px 12px; border: 1px solid var(--teal-soft);
    background: #F0FAF8; border-radius: 8px; font-size: 12.5px; color: var(--navy);
  }
  .confirm.show { display: block; }
  .confirm .row { display: flex; gap: 8px; margin-top: 9px; }
  .confirm button {
    flex: 1; padding: 8px 0; border-radius: 7px; border: 1px solid var(--teal);
    font: 600 12.5px 'Outfit', sans-serif; cursor: pointer;
  }
  .confirm .yes { background: var(--teal); color: #fff; }
  .confirm .no  { background: #fff; color: var(--teal); }

  .msg { margin-top: 12px; min-height: 22px; font-size: 12px; color: var(--gray); line-height: 1.4; }
  .msg.error { color: var(--red); }

  .foot { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .foot .stats {
    font-family: 'Spline Sans Mono', monospace; font-variant-numeric: tabular-nums;
    font-size: 11.5px; color: var(--gray);
  }
  .foot .links { margin-top: 7px; font-size: 12px; }
  .foot .links a { color: var(--teal); font-weight: 600; cursor: pointer; text-decoration: none; }
  .foot .links a:hover { text-decoration: underline; }
  .foot .links span { color: var(--line); margin: 0 4px; }
</style>
</head>
<body>
  <div class="wordmark">Hours <b>Tracker</b></div>

  <div class="section-label">Running now</div>
  <div id="runningList"></div>
  <div class="empty" id="emptyRunning">Connecting…</div>
  <button class="btn stopall" id="btnStopAll" style="display:none" disabled>■&ensp;Stop &amp; log all</button>

  <hr>

  <div class="section-label">Add a timer</div>
  <label for="client">Client</label>
  <select id="client"></select>
  <label for="task">Task</label>
  <input type="text" id="task" placeholder="What are you working on?" list="recentTasks">
  <datalist id="recentTasks"></datalist>
  <div class="chips" id="chips"></div>
  <label for="billing">Billing</label>
  <select id="billing">
    <option value="normal">Normal (bill at rate)</option>
    <option value="free">Free (no charge)</option>
    <option value="tbd">TBD (agree price later)</option>
  </select>

  <button class="btn start" id="btnStart">▶&ensp;Start timer</button>

  <div class="confirm" id="confirm">
    <span id="confirmText"></span>
    <div class="row">
      <button class="yes" id="confirmYes">Start anyway</button>
      <button class="no" id="confirmNo">Cancel</button>
    </div>
  </div>

  <div class="msg" id="msg"></div>

  <div class="foot">
    <div class="stats" id="stats">&nbsp;</div>
    <div class="links">
      <a id="lnkExport">Export PDF…</a><span>·</span><a id="lnkAdd">Add past session…</a><span>·</span><a id="lnkFee">Add project fee…</a>
    </div>
  </div>

<script>
  var state = null;
  var skewMs = 0;
  var uiSeeded = false;
  // Accumulates the rate-warning confirmation across re-tries of one Start.
  var startFlags = {};

  var $ = function (id) { return document.getElementById(id); };

  function boot() {
    refresh();
    setInterval(tickAll, 1000);
    setInterval(refresh, 30000); // catch menu/phone-driven changes
    window.addEventListener('focus', refresh);
  }

  function refresh() {
    google.script.run.withSuccessHandler(onSnap).withFailureHandler(fail).getTimerSnapshot();
  }

  function onSnap(s) {
    state = s;
    skewMs = s.serverNowMs - Date.now();
    seedForm(s);
    renderRecentTasks(s);
    renderRunning(s);
    $('stats').textContent =
      'Today ' + (s.todayHours || 0).toFixed(2) + ' h · This month ' + (s.monthHours || 0).toFixed(2) + ' h';
  }

  function seedForm(s) {
    var sel = $('client');
    var prev = sel.value;
    sel.innerHTML = '';
    s.clients.forEach(function (name) {
      var o = document.createElement('option');
      o.value = o.textContent = name;
      sel.appendChild(o);
    });
    // Seed once from the Dashboard cells, then never clobber what's mid-pick.
    if (!uiSeeded) {
      sel.value = s.dbClient || (s.clients[0] || '');
      if (s.dbTask) $('task').value = s.dbTask;
      uiSeeded = true;
    } else if (prev && s.clients.indexOf(prev) >= 0) {
      sel.value = prev;
    }
  }

  // Recent task names → the input's autocomplete <datalist> (type-ahead) plus a
  // row of one-tap chips (top 5), so a repeat session doesn't mean retyping.
  function renderRecentTasks(s) {
    var tasks = (s && s.recentTasks) || [];
    var dl = $('recentTasks');
    dl.innerHTML = '';
    tasks.forEach(function (t) {
      var o = document.createElement('option');
      o.value = t;
      dl.appendChild(o);
    });
    var chips = $('chips');
    chips.innerHTML = '';
    tasks.slice(0, 5).forEach(function (t) {
      var chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = t;
      chip.title = t;
      chip.onclick = function () { $('task').value = t; $('task').focus(); };
      chips.appendChild(chip);
    });
  }

  function renderRunning(s) {
    var list = $('runningList');
    list.innerHTML = '';
    var running = (s && s.running) || [];
    running.forEach(function (r) {
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<div class="card-top">' +
          '<div class="who"><b>' + esc(r.client) + '</b>' +
            (r.task ? '<span class="task">' + esc(r.task) + '</span>' : '') + '</div>' +
          '<div class="clock" data-start="' + r.startedAtMs + '">0:00:00</div>' +
        '</div>' +
        '<div class="card-bot">' +
          (r.free ? '<span class="free-tag">FREE · no charge</span>' :
           r.tbd ? '<span class="tbd-tag">TBD · price later</span>' : '<span></span>') +
          '<button class="stopbtn" data-start="' + r.startedAtMs + '">Stop &amp; log</button>' +
        '</div>';
      list.appendChild(card);
    });
    $('emptyRunning').textContent = 'Nothing running — pick a client and Start below.';
    $('emptyRunning').style.display = running.length ? 'none' : 'block';
    // Stop-all only earns its place with 2+ timers; one card already has a Stop.
    $('btnStopAll').style.display = running.length > 1 ? 'block' : 'none';
    $('btnStopAll').disabled = !running.length;
    var btns = list.querySelectorAll('.stopbtn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].onclick = function () { stopOne(Number(this.getAttribute('data-start'))); };
    }
    tickAll();
  }

  function tickAll() {
    var clocks = document.querySelectorAll('.clock');
    for (var i = 0; i < clocks.length; i++) {
      var startMs = Number(clocks[i].getAttribute('data-start'));
      clocks[i].textContent = fmt(Math.max(0, Date.now() + skewMs - startMs));
    }
  }

  function fmt(ms) {
    var s = Math.floor(ms / 1000);
    return Math.floor(s / 3600) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60);
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function onStart(fresh) {
    if (fresh) startFlags = {};
    var client = $('client').value;
    var task = $('task').value.trim();
    if (!task) { say("Type a task first — it can't be blank.", true); $('task').focus(); return; }
    var bill = $('billing').value;
    var opts = { free: bill === 'free', tbd: bill === 'tbd' };
    if (startFlags.confirmNoRate) opts.confirmNoRate = true;
    busy(true);
    say('Starting…', false);
    hideConfirm();
    google.script.run
      .withSuccessHandler(function (res) {
        busy(false);
        if (res && res.needsRateConfirm) { showRateConfirm(res); return; }
        if (res && res.snapshot) onSnap(res.snapshot);
        if (res && res.ok) {
          $('task').value = '';
          $('billing').value = 'normal';
          say(res.msg || ('Timing ' + client + '.'), false);
        } else {
          say((res && res.msg) || 'Could not start.', true);
        }
        if (res && !res.snapshot) refresh();
      })
      .withFailureHandler(fail)
      .startWork(client, task, opts);
  }

  function stopOne(startMs) {
    busy(true);
    say('Stopping…', false);
    google.script.run
      .withSuccessHandler(function (res) {
        busy(false);
        if (res && res.snapshot) onSnap(res.snapshot); else refresh();
        say(res && res.msg ? res.msg : '', !(res && res.ok));
      })
      .withFailureHandler(fail)
      .stopSession(startMs);
  }

  function onStopAll() {
    busy(true);
    say('Stopping all…', false);
    google.script.run
      .withSuccessHandler(function (res) {
        busy(false);
        if (res && res.snapshot) onSnap(res.snapshot); else refresh();
        say(res && res.msg ? res.msg : '', !(res && res.ok));
      })
      .withFailureHandler(fail)
      .stopAll();
  }

  function showRateConfirm(res) {
    $('confirmText').innerHTML =
      '<b>' + esc(res.client) + '</b> has no €/h rate on the Clients sheet — amounts stay <b>€0</b> ' +
      'until you add it (it back-fills past rows). Start timing anyway?';
    $('confirm').className = 'confirm show';
  }
  function hideConfirm() { $('confirm').className = 'confirm'; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function busy(b) {
    $('btnStart').disabled = b;
    $('btnStopAll').disabled = b || !(state && state.running && state.running.length);
    var btns = document.querySelectorAll('.stopbtn');
    for (var i = 0; i < btns.length; i++) btns[i].disabled = b;
  }

  function say(text, isError) {
    var m = $('msg');
    m.textContent = text || '';
    m.className = 'msg' + (isError ? ' error' : '');
  }

  function fail(err) {
    busy(false);
    say(err && err.message ? err.message : 'Something went wrong — try again.', true);
  }

  $('btnStart').onclick = function () { onStart(true); };
  $('btnStopAll').onclick = onStopAll;
  $('confirmYes').onclick = function () { startFlags.confirmNoRate = true; onStart(false); };
  $('confirmNo').onclick = function () {
    hideConfirm();
    startFlags = {};
    say('Not started — add the rate on the Clients sheet, then Start.', false);
  };
  $('lnkExport').onclick = function () { google.script.run.showExportDialog(); };
  $('lnkAdd').onclick = function () { google.script.run.showAddSessionDialog(); };
  $('lnkFee').onclick = function () { google.script.run.showAddProjectDialog(); };
  boot();
</script>
</body>
</html>
