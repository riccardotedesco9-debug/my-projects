<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1F3864; --teal: #0F766E; --gray: #6B7280;
    --line: #E4E4DE; --paper: #FBFBF8; --red: #B91C1C; --green: #2E7D32;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Outfit', sans-serif; background: var(--paper); color: var(--navy);
         padding: 16px 20px; font-size: 14px; }
  p.intro { color: var(--gray); font-size: 12.5px; line-height: 1.45; margin-bottom: 4px; }
  label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .08em;
          text-transform: uppercase; color: var(--gray); margin: 10px 0 4px; }
  select, input[type=text], input[type=date], input[type=number] {
    width: 100%; font: 16px 'Outfit', sans-serif; color: var(--navy);
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  select:focus, input:focus { outline: none; border-color: var(--teal); }
  .btn {
    width: 100%; border: 0; border-radius: 10px; padding: 12px 0; margin-top: 16px;
    font: 600 15px 'Outfit', sans-serif; color: #fff; background: var(--teal); cursor: pointer;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.18);
  }
  .btn:disabled { filter: grayscale(.6) opacity(.5); cursor: default; }
  .out { margin-top: 12px; min-height: 34px; font-size: 12.5px; line-height: 1.45; color: var(--gray); }
  .out.error { color: var(--red); }
  .out.done  { color: var(--green); font-weight: 600; }
</style>
</head>
<body>
  <p class="intro">For work billed as a flat project fee (no hourly rate). It's logged as one line with the agreed amount, and flows into your totals and exports.</p>

  <label for="client">Client</label>
  <select id="client"></select>

  <label for="desc">Project</label>
  <input type="text" id="desc" placeholder="e.g. Website redesign">

  <label for="date">Date (agreed / delivered)</label>
  <input type="date" id="date">

  <label for="amount">Agreed amount (€)</label>
  <input type="number" id="amount" min="0" step="0.01" placeholder="500.00">

  <button class="btn" id="go" disabled>Add project fee</button>
  <div class="out" id="out"></div>

<script>
  var $ = function (id) { return document.getElementById(id); };

  var now = new Date();
  $('date').value = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');

  google.script.run.withSuccessHandler(function (s) {
    var sel = $('client');
    s.clients.forEach(function (name) {
      var o = document.createElement('option');
      o.value = o.textContent = name;
      sel.appendChild(o);
    });
    if (s.dbClient) sel.value = s.dbClient;
    $('go').disabled = false;
  }).withFailureHandler(function (e) {
    show('Could not load clients: ' + (e && e.message ? e.message : e), 'error');
  }).getTimerSnapshot();

  $('go').onclick = function () {
    $('go').disabled = true;
    show('Adding…', '');
    google.script.run
      .withSuccessHandler(function (res) {
        $('go').disabled = false;
        if (res && res.ok) {
          show('Added a €' + res.amount.toFixed(2) + ' project fee. It\'s in the Time Log and counts toward earnings (not hours).', 'done');
          $('desc').value = '';
          $('amount').value = '';
        } else {
          show((res && res.msg) || 'Could not add the project fee.', 'error');
        }
      })
      .withFailureHandler(function (e) {
        $('go').disabled = false;
        show('Failed: ' + (e && e.message ? e.message : e), 'error');
      })
      .addProjectFee({
        client: $('client').value,
        description: $('desc').value.trim(),
        dateIso: $('date').value,
        amount: $('amount').value,
      });
  };

  function show(text, cls) {
    var o = $('out');
    o.textContent = text;
    o.className = 'out ' + (cls || '');
  }
</script>
</body>
</html>
