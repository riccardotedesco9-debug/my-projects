<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1F3864; --teal: #0F766E; --gray: #6B7280;
    --line: #E4E4DE; --paper: #FBFBF8; --red: #B91C1C; --green: #2E7D32;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Outfit', sans-serif; background: var(--paper); color: var(--navy);
         padding: 16px 20px; font-size: 14px; }
  label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .08em;
          text-transform: uppercase; color: var(--gray); margin: 10px 0 4px; }
  select, input[type=text], input[type=date], input[type=time] {
    width: 100%; font: 16px 'Outfit', sans-serif; color: var(--navy);
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  select:focus, input:focus { outline: none; border-color: var(--teal); }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .toggle { display: flex; align-items: center; gap: 9px; margin-top: 12px; font-size: 13px; }
  .toggle input { width: 16px; height: 16px; accent-color: var(--teal); }
  .btn {
    width: 100%; border: 0; border-radius: 10px; padding: 12px 0; margin-top: 16px;
    font: 600 15px 'Outfit', sans-serif; color: #fff; background: var(--teal); cursor: pointer;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.18);
  }
  .btn:disabled { filter: grayscale(.6) opacity(.5); cursor: default; }
  .out { margin-top: 12px; min-height: 34px; font-size: 12.5px; line-height: 1.45; color: var(--gray); }
  .out.error { color: var(--red); }
  .out.done  { color: var(--green); font-weight: 600; }
</style>
</head>
<body>
  <label for="client">Client</label>
  <select id="client"></select>

  <label for="task">Task</label>
  <input type="text" id="task" placeholder="What was the work?">

  <label for="date">Date (session start)</label>
  <input type="date" id="date">

  <div class="row">
    <div><label for="start">Start</label><input type="time" id="start"></div>
    <div><label for="end">End</label><input type="time" id="end"></div>
  </div>

  <div class="toggle">
    <input type="checkbox" id="nextDay">
    <span>Ends next day (overnight session)</span>
  </div>

  <button class="btn" id="go" disabled>Log session</button>
  <div class="out" id="out"></div>

<script>
  var $ = function (id) { return document.getElementById(id); };

  // Default the date to today (browser-local == Malta for this user).
  var now = new Date();
  $('date').value = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');

  google.script.run.withSuccessHandler(function (s) {
    var sel = $('client');
    s.clients.forEach(function (name) {
      var o = document.createElement('option');
      o.value = o.textContent = name;
      sel.appendChild(o);
    });
    if (s.dbClient) sel.value = s.dbClient;
    $('go').disabled = false;
  }).withFailureHandler(function (e) {
    show('Could not load clients: ' + (e && e.message ? e.message : e), 'error');
  }).getTimerSnapshot();

  $('go').onclick = function () {
    $('go').disabled = true;
    show('Logging…', '');
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.ok) {
          show('Logged ' + res.hours.toFixed(2) + ' h — the row is in the Time Log with live formulas.', 'done');
          $('task').value = '';
          $('go').disabled = false;
        } else {
          show((res && res.msg) || 'Could not log the session.', 'error');
          $('go').disabled = false;
        }
      })
      .withFailureHandler(function (e) {
        show('Failed: ' + (e && e.message ? e.message : e), 'error');
        $('go').disabled = false;
      })
      .addManualSession({
        client: $('client').value,
        task: $('task').value.trim(),
        dateIso: $('date').value,
        startHm: $('start').value,
        endHm: $('end').value,
        nextDay: $('nextDay').checked,
      });
  };

  function show(text, cls) {
    var o = $('out');
    o.textContent = text;
    o.className = 'out ' + (cls || '');
  }
</script>
</body>
</html>
