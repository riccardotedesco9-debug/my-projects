<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Spline+Sans+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1F3864; --teal: #0F766E; --green: #2E7D32; --red: #B91C1C;
    --gray: #6B7280; --line: #E4E4DE; --paper: #FBFBF8;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Outfit', sans-serif; background: var(--paper); color: var(--navy);
         padding: 16px 18px; font-size: 14px; }
  p { line-height: 1.5; }
  .session {
    margin: 10px 0; padding: 9px 13px; background: #fff; border-left: 3px solid var(--green);
    border-radius: 0 8px 8px 0; box-shadow: 0 1px 2px rgba(31,56,100,.06);
  }
  .session b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session .since { color: var(--gray); font-size: 12.5px; }
  .free-tag { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--green);
              background: #E8F5E9; border-radius: 4px; padding: 1px 5px; margin-left: 6px; }
  .tbd-tag { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: #B45309;
             background: #FEF3C7; border-radius: 4px; padding: 1px 5px; margin-left: 6px; }
  .elapsed { font-family: 'Spline Sans Mono', monospace; font-variant-numeric: tabular-nums;
             font-weight: 600; color: var(--green); }
  .row { display: flex; gap: 8px; margin-top: 9px; }
  button {
    flex: 1; padding: 8px 0; border-radius: 8px; cursor: pointer;
    font: 600 12.5px 'Outfit', sans-serif; border: 1px solid transparent;
  }
  .keep { background: var(--green); color: #fff; box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }
  .log  { background: #fff; color: var(--navy); border-color: var(--line); }
  .discard { background: none; color: var(--red); border-color: transparent; }
  button:disabled { opacity: .5; cursor: default; }
  .footer { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .hint { margin-top: 10px; font-size: 11.5px; color: var(--gray); }
</style>
</head>
<body>
  <p id="lede">Loading timers…</p>
  <div id="list"></div>

  <div class="row footer">
    <button class="keep" id="keepAll" disabled>Keep all</button>
    <button class="log" id="stopAll" disabled>Stop &amp; log all</button>
    <button class="discard" id="discardAll" disabled>Discard all</button>
  </div>
  <div class="hint">Keep = the session keeps ticking from its original start. Discard cannot be undone.</div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var skewMs = 0;

  function load(s) {
    skewMs = s.serverNowMs - Date.now();
    var running = (s && s.running) || [];
    if (running.length === 0) { google.script.host.close(); return; }
    $('lede').innerHTML = running.length === 1
      ? 'A timer was <b>still running</b> when this spreadsheet was last closed — nothing was lost.'
      : running.length + ' timers were <b>still running</b> when this spreadsheet was last closed — nothing was lost.';
    var list = $('list');
    list.innerHTML = '';
    running.forEach(function (r) {
      var card = document.createElement('div');
      card.className = 'session';
      card.innerHTML =
        '<b>' + esc(r.client) + (r.task ? ' — ' + esc(r.task) : '') +
          (r.free ? '<span class="free-tag">FREE</span>' : (r.tbd ? '<span class="tbd-tag">TBD</span>' : '')) + '</b>' +
        '<span class="since">running for <span class="elapsed" data-start="' + r.startedAtMs + '">0:00:00</span></span>' +
        '<div class="row">' +
          '<button class="log" data-start="' + r.startedAtMs + '" data-act="stop">Stop &amp; log</button>' +
          '<button class="discard" data-start="' + r.startedAtMs + '" data-act="discard">Discard</button>' +
        '</div>';
      list.appendChild(card);
    });
    wire();
    setEnabled(true);
    tick();
  }

  function wire() {
    var btns = $('list').querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].onclick = function () {
        var act = this.getAttribute('data-act');
        if (act === 'discard' && !this.dataset.armed) {
          this.dataset.armed = '1';
          this.textContent = 'Really discard?';
          return;
        }
        choose(act, Number(this.getAttribute('data-start')));
      };
    }
  }

  function tick() {
    var els = $('list').querySelectorAll('.elapsed');
    for (var i = 0; i < els.length; i++) {
      var startMs = Number(els[i].getAttribute('data-start'));
      var s = Math.floor(Math.max(0, Date.now() + skewMs - startMs) / 1000);
      els[i].textContent = Math.floor(s / 3600) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60);
    }
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function setEnabled(on) {
    ['keepAll', 'stopAll', 'discardAll'].forEach(function (id) { $(id).disabled = !on; });
    var btns = $('list').querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) btns[i].disabled = !on;
  }

  function choose(act, startMs) {
    setEnabled(false);
    google.script.run
      .withSuccessHandler(function (s) {
        var running = (s && s.running) || [];
        if (running.length === 0) { google.script.host.close(); return; }
        load(s); // re-render the remaining cards
      })
      .withFailureHandler(function (err) {
        $('lede').textContent = 'Could not apply that: ' + (err && err.message ? err.message : err);
        setEnabled(true);
      })
      .recoveryChoice(act, startMs);
  }

  $('keepAll').onclick = function () { google.script.host.close(); };
  $('stopAll').onclick = function () { choose('stopAll', 0); };
  $('discardAll').onclick = function () {
    if (this.dataset.armed) { choose('discardAll', 0); return; }
    this.dataset.armed = '1';
    this.textContent = 'Really discard all?';
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  google.script.run.withSuccessHandler(load).withFailureHandler(function () {
    $('lede').textContent = 'Could not read the running timers.';
  }).getTimerSnapshot();
  setInterval(tick, 1000);
</script>
</body>
</html>
