<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Adopt Me — Box Turtle Poster</title>
  <link rel="stylesheet" href="poster.css">
</head>
<body>
  <div class="poster">

    <!-- decorative dots -->
    <div class="dots">
      <span class="dot y" style="top:10mm; right:16mm"></span>
      <span class="dot c" style="top:18mm; right:26mm"></span>
      <span class="dot o" style="top:9mm;  right:34mm"></span>
      <span class="dot y" style="top:24mm; right:12mm"></span>
      <span class="dot o" style="bottom:120mm; left:10mm"></span>
      <span class="dot c" style="bottom:128mm; left:18mm"></span>
    </div>

    <!-- header -->
    <div class="kicker">Find me a forever home</div>
    <h1 class="headline">
      <span class="l1">Adopt</span>
      <span class="l2">Me<em>!</em></span>
    </h1>

    <!-- hero -->
    <div class="hero">
      <div class="blob"></div>
      <img class="turtle" src="assets/turtle-hero.png" alt="Box turtle for adoption">
      <span class="tag">Box Turtle</span>
    </div>

    <!-- pitch -->
    <p class="pitch">
      I'm a curious little <b>box turtle</b> looking for someone<br>
      to share slow mornings and leafy snacks with.
    </p>

    <!-- contact bar -->
    <div class="contact">
      <div class="shop">
        <div class="name">The Shell Shop</div>
        <div class="sub">Reptiles &amp; Exotics · Mellieħa</div>
      </div>
      <div class="lines">
        Come meet me in store<br>
        <span>+356 2157 8800</span>
        <span class="small">12, Triq il-Kbira, Mellieħa</span>
        <span class="ig">@theshellshop.mt</span>
      </div>
    </div>

  </div>
</body>
</html>
